name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the workflows themselves
        shell: bash
        run: bash scripts/check-workflows.sh

      - name: Format check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --all-targets

      - name: Headless render smoke test
        shell: bash
        run: cargo run --example render_demo -- --check

      - name: Build release binary
        shell: bash
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bpmc-${{ matrix.os }}
          path: |
            target/release/bpmc
            target/release/bpmc.exe
          if-no-files-found: ignore
