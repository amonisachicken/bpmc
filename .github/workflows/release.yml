name: Release

on:
  push:
    tags: ["v*"]

# Required so the job may create the GitHub Release.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One guard job, so a mistyped tag fails in seconds instead of after three
  # platform builds.
  tag:
    name: check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$GITHUB_REF_NAME  cargo version=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${manifest}"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: target/release/bpmc
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: target/x86_64-apple-darwin/release/bpmc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: target/aarch64-apple-darwin/release/bpmc
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: target/x86_64-pc-windows-msvc/release/bpmc.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${{ needs.tag.outputs.version }}"
          name="bpmc-${version}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "${{ matrix.bin }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -la dist || ls -la .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.tag.outputs.version }}"
          $name = "bpmc-$version-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "${{ matrix.bin }}" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Remove-Item -Recurse -Force "dist/$name"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
          Get-ChildItem dist

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          gh release upload "$tag" dist/* --clobber
